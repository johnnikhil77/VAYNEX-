[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vaynex-backend"
version = "0.1.0"
description = "Vaynex - Agentic AI Public Infrastructure Intelligence Platform (prototype backend)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary - hackathon prototype" }
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<1.0",
    "geoalchemy2>=0.16,<1.0",
    "alembic>=1.14,<2.0",
    "redis>=5.2,<7.0",
    "pyjwt>=2.9,<3.0",
    "argon2-cffi>=23.1,<26.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10.0",
    "anyio>=4.4,<5.0",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["apps*", "packages*", "tools*"]

[tool.setuptools.package-data]
"packages.database" = ["alembic/*.mako", "alembic/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning:geoalchemy2.*",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008", "UP046", "UP047"]  # keep Generic[] for 3.11 tooling compatibility

[tool.ruff.lint.isort]
known-first-party = ["apps", "packages"]
